name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'   # adjust if needed

      - name: Build backend
        run: mvn clean package -DskipTests

      - name: Build frontend
        run: |
          cd frontend/leetchess
          npm install
          npm run build

      # Save PEM key
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      # Copy backend JAR
      - name: Copy backend to EC2
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no \
          target/chess-puzzle-platform-0.0.1-SNAPSHOT.jar \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/

      # Copy frontend build
      - name: Copy frontend to EC2
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no -r \
          frontend/dist/* \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/var/www/leetchess.net/html/

      # SSH and restart app
      - name: Restart app on EC2
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          # Stop existing app
          pkill -f chess-puzzle-platform || true

          # Start new app
          nohup projects/run.sh > myapp.log 2>&1 & 
          EOF